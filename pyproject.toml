[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "favit-lsda"
version = "0.1.0"
description = "FA-ViT with latent-space augmentation for generalized deepfake detection"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["favit_lsda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
